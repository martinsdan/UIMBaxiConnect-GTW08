# ============================================================================
# SELECTS - Read-write control options
# ============================================================================

select:
  # Algorithm Type (Register 258) - Remote management mode per Tab.19
  - platform: modbus_controller
    modbus_controller_id: gtw08_controller
    name: "Algorithm Type"
    id: algorithm_type_select
    icon: mdi:cog
    address: 258
    value_type: U_WORD
    use_write_multiple: true
    entity_category: config
    optionsmap:
      "Both Temp & Power": 0
      "Power Only": 1
      "Temperature Only": 2
      "Monitoring Only": 3

  # Heat Demand control (Register 259) - Valid options per Tab.20: 0=Standby, 7=Heating, 8=Cooling
  - platform: modbus_controller
    modbus_controller_id: gtw08_controller
    name: "Heat Demand"
    id: heat_demand_select
    icon: mdi:thermostat
    address: 259
    value_type: U_WORD
    use_write_multiple: true
    entity_category: config
    optionsmap:
      "Standby": 0
      "Heating": 7
      "Cooling": 8
    on_value:
      then:
        - if:
            condition:
              lambda: 'return id(boot_complete);'
            then:
              - if:
                  condition:
                    lambda: 'return x == "Heating";'
                  then:
                    - light.turn_on:
                        id: status_led
                        brightness: 100%
                        red: 0%
                        green: 0%
                        blue: 100%
              - if:
                  condition:
                    lambda: 'return x == "Cooling";'
                  then:
                    - light.turn_on:
                        id: status_led
                        brightness: 100%
                        red: 0%
                        green: 100%
                        blue: 100%
              - if:
                  condition:
                    lambda: 'return x == "Standby";'
                  then:
                    - light.turn_on:
                        id: status_led
                        brightness: 30%
                        red: 100%
                        green: 50%
                        blue: 0%

