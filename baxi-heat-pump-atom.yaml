  # ============================================================================
  # BOARD DIAGNOSTIC TEXT SENSORS
  # ============================================================================
  
  # Board 1 device type decoded
  - platform: template
    name: "Board 1 Type"
    icon: mdi:chip
    entity_category: diagnostic
    update_interval: 30s
    lambda: |-
      uint16_t device_type = (uint16_t)id(board1_device_type).state;
      if (device_type == 0xFFFF || device_type == 0) {
        return std::string("Not Available");
      }
      uint8_t category = (device_type >> 8) & 0xFF;
      uint8_t number = device_type & 0xFF;

      switch(category) {
        case 0x00: return std::string("CU-GH" + (number > 0 ? to_string(number) : ""));
        case 0x01: return std::string("CU-OH" + (number > 0 ? to_string(number) : ""));
        case 0x02: return std::string("EHC" + (number > 0 ? to_string(number) : ""));
        case 0x14: return std::string("MK" + (number > 0 ? to_string(number) : ""));
        case 0x19: return std::string("SCB" + (number > 0 ? to_string(number) : ""));
        case 0x1B: return std::string("EEC" + (number > 0 ? to_string(number) : ""));
        case 0x1E: return std::string("Gateway" + (number > 0 ? to_string(number) : ""));
        default: return std::string("Unknown (0x" + to_string(device_type) + ")");
      }

