    icon: mdi:home-thermometer
    address: 1104
    register_type: holding
    value_type: S_WORD
    unit_of_measurement: "°C"
    device_class: temperature
    state_class: measurement
    accuracy_decimals: 1
    filters:
      - lambda: |-
          int16_t raw = (int16_t)x;
          if (raw == -32768 || raw == 0x7FFF) return {};  // 0x8000 = unavailable
          return raw * 0.1f;

