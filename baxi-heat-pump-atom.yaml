# ============================================================================
# NUMBER CONTROLS - Read-write numeric values
# ============================================================================
number:

  # Zone 1 Heating Curve Configuration (Registers 675 & 674)
  # These registers control the intelligent heating curve for Zone 1
  # Base temperature is the target flow at 20°C outdoor
  # Gradient is the temperature increase per °C of outdoor temperature drop

  # Base Temperature Setpoint (Register 675 - CP210)
  # Display: 15.0-40.0°C, Lambda: divides by 10 for read, multiplies by 10 for write
  - platform: modbus_controller
    modbus_controller_id: gtw08_controller
    name: "Heating Curve Base"
    id: zone1_curve_base
    icon: mdi:chart-bell-curve
    address: 675
    register_type: holding
    value_type: U_WORD
    use_write_multiple: true
    min_value: 15.0
    max_value: 40.0
    step: 0.1
    unit_of_measurement: "°C"
    entity_category: config
    mode: box
    lambda: |-
      uint16_t raw = (uint16_t)x;
      if (raw == 0xFFFF || raw == 0) {
        return NAN;  // Invalid/unavailable
      }
      return raw * 0.1f;
    write_lambda: |-
      // Keep this in sync with min_value/max_value above.
      if (isnan(x) || x < 15.0f || x > 40.0f) {
        ESP_LOGW("zone1_curve_base", "Rejecting out-of-range write: %.1f", x);
        return {};  // Abort the write; register is left untouched
      }
      return (uint16_t)(x * 10.0f);


  # Heating Curve Gradient (Register 674 - CP230)
  # Display: 0.0-2.0, Lambda: divides by 10 for read, multiplies by 10 for write
  - platform: modbus_controller
    modbus_controller_id: gtw08_controller
    name: "Heating Curve Gradient"
    id: zone1_curve_gradient
    icon: mdi:chart-bell-curve-cumulative
    address: 674
    register_type: holding
    value_type: U_WORD
    use_write_multiple: true
    min_value: 0.0
    max_value: 2.0
    step: 0.1
    entity_category: config
    mode: box
    lambda: |-
      uint16_t raw = (uint16_t)x;
      if (raw == 0xFFFF || raw == 0) {
        return NAN;  // Invalid/unavailable
      }
      return raw * 0.1f;
    write_lambda: |-
      // Keep this in sync with min_value/max_value above.
      if (isnan(x) || x < 0.0f || x > 2.0f) {
        ESP_LOGW("zone1_curve_gradient", "Rejecting out-of-range write: %.1f", x);
        return {};  // Abort the write; register is left untouched
      }
      return (uint16_t)(x * 10.0f);

