substitutions:
  devicename: baxiheatpumpatom
  friendly_name: "Baxi Heat Pump Atom"

esphome:
  name: ${devicename}
  friendly_name: ${friendly_name}
  project:
    name: "Liberdade4.UIMBaxiConnect-GTW08"
    version: "1.2"
  on_boot:
    priority: -100
    then:
      - globals.set:
          id: boot_complete
          value: 'true'
      - logger.log: "Boot complete, select is now active"

esp32:
  board: esp32-s3-devkitc-1
  framework:
    type: arduino

# Global variable to prevent select actions during boot
globals:
  - id: boot_complete
    type: bool
    restore_value: no
    initial_value: 'false'

# Wi-Fi configuration
wifi:
  ssid: !secret wifi_ssid
  password: !secret wifi_password
  domain: .iot.liberdade4.com
  fast_connect: true
  ap:
    ssid: "${friendly_name} Fallback"
    password: !secret fallback_ap_password

captive_portal:

web_server:
  port: 80

# Home Assistant API
api:
  encryption:
    key: !secret api_key

ota:
  - platform: esphome
    encryption:  # Inherits the api encryption key above; cheaper and stronger than a password

# Logs (baud_rate: 0 frees UART for Modbus)
logger:
  level: INFO
  baud_rate: 0

button:
  - platform: restart
    name: "Restart"
    icon: mdi:restart

# Integrated status LED on AtomS3
light:
  - platform: esp32_rmt_led_strip
    channel_colors: GRB
    pin: GPIO35
    num_leds: 1
    chipset: ws2812
    name: "${friendly_name} Status LED"
    id: status_led
    internal: true
    effects:
      - pulse:
          name: "Pulse"
      - strobe:
          name: "Strobe"

# UART configuration for Modbus RS485 via GTW-08
uart:
  id: modbus_uart
  tx_pin: GPIO6
  rx_pin: GPIO5
  baud_rate: 9600
  stop_bits: 1
  parity: NONE

# Modbus RTU
modbus:
  id: modbus1
  uart_id: modbus_uart
  send_wait_time: 250ms
  turnaround_time: 1000ms  # Command spacing (replaces the deprecated per-controller command_throttle)

modbus_controller:
  - id: gtw08_controller
    address: 0x64 # GTW-08 default Modbus address (100 decimal = 0x64 hex)
    modbus_id: modbus1
    setup_priority: 100 # Higher priority to ensure reads complete before select evaluates
    update_interval: 30s      # Increased from 15s
    offline_skip_updates: 5 # Skip updates if no response

  # Same physical device; polls the rarely-changing board diagnostic
  # registers on a slower interval. Replaces the deprecated per-sensor
  # skip_updates (previously every 10th 30s cycle = 5 min).
  - id: gtw08_controller_diag
    address: 0x64
    modbus_id: modbus1
    setup_priority: 99
    update_interval: 5min

serial_proxy:
  - id: rs485_serial
    uart_id: modbus_uart
    name: ${friendly_name} Bus
    port_type: RS485

# ============================================================================
# SENSORS - Read-only values from heat pump via Modbus
# ============================================================================

sensor:
  # Outdoor temperature (Register 384) - Read only, per GTW-08 manual
  # Prioritized first for early polling
  - platform: modbus_controller
    modbus_controller_id: gtw08_controller
    name: "Outdoor Temperature"
    id: outdoor_temp
    icon: mdi:thermometer
    address: 384
    register_type: holding
    value_type: S_WORD
    unit_of_measurement: "°C"
    device_class: temperature
    state_class: measurement
    accuracy_decimals: 2
    filters:
      - multiply: 0.01
      - skip_initial: 3
      - lambda: |-
          static float last = NAN;
          const float MAX_DELTA = 2.0f;  // max allowed change per 15 s

          if (isnan(last)) {
            last = x;
            return x;  // first reading
          }

          if (fabsf(x - last) > MAX_DELTA) {
            ESP_LOGW("outdoor_temp", "Outlier ignored: last=%.2f new=%.2f", last, x);
            return {};  // drop this sample, HA keeps previous value
          }

          last = x;
          return x;

  # Flow temperature (Register 400 - AM016)
  - platform: modbus_controller
    modbus_controller_id: gtw08_controller
    name: "Flow Temperature"
    id: temp_flow
    icon: mdi:thermometer-chevron-up
    address: 400
    register_type: holding
    value_type: S_WORD
    unit_of_measurement: "°C"
    device_class: temperature
    state_class: measurement
    accuracy_decimals: 2
    filters:
      - multiply: 0.01

  # Return temperature (Register 401 - AM018)
  - platform: modbus_controller
    modbus_controller_id: gtw08_controller
    name: "Return Temperature"
    id: temp_return
    icon: mdi:thermometer-chevron-down
    address: 401
    register_type: holding
    value_type: S_WORD
    unit_of_measurement: "°C"
    device_class: temperature
    state_class: measurement
    accuracy_decimals: 2
    filters:
      - multiply: 0.01

  # Heat pump flow temperature (Register 403 - HM001)
  - platform: modbus_controller
    modbus_controller_id: gtw08_controller
    name: "HP Flow Temperature"
    id: hp_temp_flow
    icon: mdi:heat-pump
    address: 403
    register_type: holding
    value_type: S_WORD
    unit_of_measurement: "°C"
    device_class: temperature
    state_class: measurement
    accuracy_decimals: 2
    filters:
      - multiply: 0.01

  # Heat pump return temperature (Register 404 - HM002)
  - platform: modbus_controller
    modbus_controller_id: gtw08_controller
    name: "HP Return Temperature"
    id: hp_temp_return
    icon: mdi:heat-pump-outline
    address: 404
    register_type: holding
    value_type: S_WORD
    unit_of_measurement: "°C"
    device_class: temperature
    state_class: measurement
    accuracy_decimals: 2
    filters:
      - multiply: 0.01

  # Water pressure (Register 409 - AM019, UINT8 0.1 bar) - FIXED SENTINEL HANDLING
  - platform: modbus_controller
    modbus_controller_id: gtw08_controller
    name: "Water Pressure"
    id: water_pressure
    icon: mdi:gauge
    address: 409
    register_type: holding
    value_type: U_WORD
    unit_of_measurement: "bar"
    device_class: pressure
    state_class: measurement
    accuracy_decimals: 1
    filters:
      - lambda: |-
          uint16_t raw = (uint16_t)x;
          uint8_t pressure_raw = raw & 0x00FF;   // Extract UINT8 from low byte
          if (pressure_raw == 0xFF || pressure_raw == 255) {
            return {};  // Data not available
          }
          float pressure = pressure_raw * 0.1f;
          if (pressure < 0.0f || pressure > 3.0f) {
            return {};  // Out of valid range
          }
          return pressure;

  # Number of control boards (Register 128) - polled every 5 min via gtw08_controller_diag
  - platform: modbus_controller
    modbus_controller_id: gtw08_controller_diag
    name: "Number of Control Boards"
    id: num_control_boards
    address: 128
    register_type: holding
    value_type: U_WORD
    icon: mdi:format-list-numbered
    entity_category: diagnostic
    filters:
      - lambda: |-
          return (uint16_t)x & 0x00FF;   // Extract UINT8 from low byte

  # Board 1 device type (Register 129) - polled every 5 min via gtw08_controller_diag
  - platform: modbus_controller
    modbus_controller_id: gtw08_controller_diag
    name: "Board 1 Device Type"
    id: board1_device_type
    address: 129
    register_type: holding
    value_type: U_WORD
    entity_category: diagnostic
    internal: true  # Hide raw hex value, use text sensor instead

  # Board 2 device type (Register 135) - polled every 5 min via gtw08_controller_diag
  - platform: modbus_controller
    modbus_controller_id: gtw08_controller_diag
    name: "Board 2 Device Type"
    id: board2_device_type
    address: 135
    register_type: holding
    value_type: U_WORD
    entity_category: diagnostic
    internal: true  # Hide raw hex value, use text sensor instead

  # Board 3 device type (Register 141) - polled every 5 min via gtw08_controller_diag
  - platform: modbus_controller
    modbus_controller_id: gtw08_controller_diag
    name: "Board 3 Device Type"
    id: board3_device_type
    address: 141
    register_type: holding
    value_type: U_WORD
    entity_category: diagnostic
    internal: true  # Hide raw hex value, use text sensor instead

  # Error flags (Register 277) - List of errors for all devices
  - platform: modbus_controller
    modbus_controller_id: gtw08_controller
    name: "Error Flags"
    id: error_flags
    address: 277
    register_type: holding
    value_type: U_WORD
    icon: mdi:alert-circle-outline
    entity_category: diagnostic
    filters:
      - lambda: |-
          if (x >= 65535.0) return {};
          return x;

  # System status (Register 411 - AM012 - Main appliance status)
  - platform: modbus_controller
    modbus_controller_id: gtw08_controller
    name: "System Status Code"
    id: system_status_code
    address: 411
    register_type: holding
    value_type: U_WORD
    internal: true # Hide from Home Assistant
    filters:
      - lambda: return (uint16_t)x & 0x00FF; # Extract ENUM8 from low byte

  # Sub status (Register 412 - AM014 - Sub status)
  - platform: modbus_controller
    modbus_controller_id: gtw08_controller
    name: "Sub Status Code"
    id: sub_status_code
    address: 412
    register_type: holding
    value_type: U_WORD
    internal: true # Hide from Home Assistant - use template version for readable text
    filters:
      - lambda: return (uint16_t)x & 0x00FF; # Extract ENUM8 from low byte

  # System power output (Register 413 - AM024) - UINT16, 0.0001 resolution, 0-100%
  - platform: modbus_controller
    modbus_controller_id: gtw08_controller
    name: "Power Output"
    id: power_output
    icon: mdi:flash
    address: 413
    register_type: holding
    value_type: U_WORD
    unit_of_measurement: "%"
    state_class: measurement
    accuracy_decimals: 1
    filters:
      - lambda: |-
          uint16_t raw = (uint16_t)x;
          if (raw == 0xFFFF || raw == 0) {
            return {};  // Data not available
          }
          // 0.0001 resolution: raw 10000 = 1.0 = 100%
          float pct = raw * 0.01f;
          if (pct > 100.0f || pct < 0.0f) {
            return {};  // Out of valid percentage range
          }
          return pct;

  # Calculated instantaneous COP (Register 9230 - HM031) - FIXED SENTINEL HANDLING
  # reuse_previous_range: false - hybrid section (9200+) is a separate address range
  - platform: modbus_controller
    modbus_controller_id: gtw08_controller
    name: "COP - Instantaneous"
    id: cop_instantaneous
    icon: mdi:chart-line
    address: 9230
    register_type: holding
    value_type: U_WORD
    reuse_previous_range: false
    unit_of_measurement: ""
    state_class: measurement
    accuracy_decimals: 3
    filters:
      - lambda: |-
          uint16_t raw = uint16_t(x);
          if (raw == 0xFFFF || raw == 0) {
            return {};  // Data not available
          }
          return raw * 0.001f;

  # Current system power from consumer manager (Register 272)
  - platform: modbus_controller
    modbus_controller_id: gtw08_controller
    name: "Current System Power"
    id: current_system_power
    icon: mdi:lightning-bolt
    address: 272
    register_type: holding
    value_type: U_WORD      # UINT8 in low byte
    unit_of_measurement: "%"
    state_class: measurement
    accuracy_decimals: 0
    filters:
      - lambda: |-
          uint16_t raw = (uint16_t)x;
          uint8_t power_raw = raw & 0x00FF;   // take UINT8 from low byte
          if (power_raw > 100) {
            ESP_LOGD("baxi_system_power", "System Power out of range: raw=%u", power_raw);
             return {};  // Return empty optional instead of NAN
          }
          return (float)power_raw;

  # Pump speed (Register 459 - AM010)
  - platform: modbus_controller
    modbus_controller_id: gtw08_controller
    name: "Pump Speed"
    id: pump_speed
    icon: mdi:pump
    address: 459
    register_type: holding
    value_type: U_WORD      # UINT16 0.1%
    unit_of_measurement: "%"
    state_class: measurement
    accuracy_decimals: 1
    filters:
      - lambda: |-
          uint16_t raw = (uint16_t)x;
          if (raw == 0xFFFF) {
            ESP_LOGD("baxi_pump", "Pump Speed unavailable: raw=%u", raw);
            return {};  // Return empty optional instead of NAN
          }
          float speed = raw * 0.1f;
          if (speed < 0.0f || speed > 100.0f) {
            ESP_LOGD("baxi_pump", "Pump Speed out of range: raw=%u, speed=%.1f", raw, speed);
            return {};  // Return empty optional instead of NAN
          }
          return speed;

  # Seasonal Mode (Register 385) - Read as sensor, convert via template
  - platform: modbus_controller
    modbus_controller_id: gtw08_controller
    name: "Seasonal Mode Code"
    id: seasonal_mode_code
    address: 385
    register_type: holding
    value_type: U_WORD
    entity_category: diagnostic
    internal: true
    filters:
      - lambda: |-
          uint16_t raw = (uint16_t)x;
          if (raw == 0xFFFF) return {};  // Not available yet
          return raw & 0x00FF;   // Extract ENUM8 from low byte

  # WiFi signal
  - platform: wifi_signal
    name: "WiFi Signal"
    icon: mdi:wifi
    update_interval: 60s

  # Uptime
  - platform: uptime
    name: "Uptime"
    icon: mdi:timer-outline

  # Calculated target temperature based on heating curve
  # Formula: Base + (20 - Outdoor Temp) * Gradient
  - platform: template
    name: "Heating Curve Target"
    id: heating_curve_target
    icon: mdi:thermometer-check
    unit_of_measurement: "°C"
    device_class: temperature
    state_class: measurement
    accuracy_decimals: 2
    update_interval: 15s
    lambda: |-
      float base_temp = id(zone1_curve_base).state;
      float gradient = id(zone1_curve_gradient).state;
      float out_temp = id(outdoor_temp).state;
      // Calculate: Base + (20 - Outdoor) * Gradient
      float target = base_temp + (20.0 - out_temp) * gradient;
      return target;


  # ============================================================================
  # ENERGY MONITORING - Cumulative consumption in kWh
  # ============================================================================

  # Central heating energy (Register 433 - AC005)
  - platform: modbus_controller
    modbus_controller_id: gtw08_controller
    name: "Energy - Central Heating"
    id: energy_ch
    icon: mdi:lightning-bolt
    address: 433
    register_type: holding
    value_type: U_DWORD  # 32-bit unsigned (kWh total)
    unit_of_measurement: "kWh"
    device_class: energy
    state_class: total_increasing
    accuracy_decimals: 0
    filters:
      # Filter invalid zero reading on startup or error
      - lambda: |-
          if (x > 4000000000.0) return {}; 
          return x;

  # Domestic hot water energy (Register 435 - AC006)
  - platform: modbus_controller
    modbus_controller_id: gtw08_controller
    name: "Energy - Domestic Hot Water"
    id: energy_dhw
    icon: mdi:faucet
    address: 435
    register_type: holding
    value_type: U_DWORD
    unit_of_measurement: "kWh"
    device_class: energy
    state_class: total_increasing
    accuracy_decimals: 0
    filters:
      - lambda: |-
          if (x > 4000000000.0) return {}; 
          return x;

  # Cooling energy (Register 437 - AC007)
  - platform: modbus_controller
    modbus_controller_id: gtw08_controller
    name: "Energy - Cooling"
    id: energy_cooling
    icon: mdi:snowflake
    address: 437
    register_type: holding
    value_type: U_DWORD
    unit_of_measurement: "kWh"
    device_class: energy
    state_class: total_increasing
    accuracy_decimals: 0
    filters:
      - lambda: |-
          if (x > 4000000000.0) return {}; 
          return x;

  # Total energy consumed (Register 439)
  - platform: modbus_controller
    modbus_controller_id: gtw08_controller
    name: "Energy - Total"
    id: energy_total
    icon: mdi:lightning-bolt-circle
    address: 439
    register_type: holding
    value_type: U_DWORD
    unit_of_measurement: "kWh"
    device_class: energy
    state_class: total_increasing
    accuracy_decimals: 0
    filters:
      - lambda: |-
          if (x > 4000000000.0) return {}; 
          return x;

  # Actual power output (Register 460 - AM047, 0.01 kW resolution) - FIXED SENTINEL HANDLING
  - platform: modbus_controller
    modbus_controller_id: gtw08_controller
    name: "Power - Actual Output"
    id: power_actual
    icon: mdi:flash
    address: 460
    register_type: holding
    value_type: U_DWORD # Changed from U_WORD to U_DWORD (32-bit) per documentation
    unit_of_measurement: "kW"
    device_class: power
    state_class: measurement
    accuracy_decimals: 2
    filters:
      - lambda: |-
          uint32_t raw = uint32_t(x);
          if (raw == 0xFFFFFFFF || raw == 0) {
            return {};  // Data not available
          }
          return raw * 0.01f;

  # ============================================================================
  # ADDITIONAL SENSORS - Useful monitoring registers not yet mapped
  # ============================================================================

  # DHW Internal Setpoint (Register 405 - AM101) - 0.01°C
  - platform: modbus_controller
    modbus_controller_id: gtw08_controller
    name: "DHW Internal Setpoint"
    id: dhw_internal_setpoint
    icon: mdi:water-thermometer
    address: 405
    register_type: holding
    value_type: U_WORD
    unit_of_measurement: "°C"
    device_class: temperature
    state_class: measurement
    accuracy_decimals: 2
    filters:
      - lambda: |-
          uint16_t raw = (uint16_t)x;
          if (raw == 0xFFFF) return {};
          return raw * 0.01f;

  # CH Setpoint of Appliance (Register 406 - PM002) - 0.01°C
  - platform: modbus_controller
    modbus_controller_id: gtw08_controller
    name: "CH Setpoint"
    id: ch_setpoint
    icon: mdi:thermometer-chevron-up
    address: 406
    register_type: holding
    value_type: U_WORD
    unit_of_measurement: "°C"
    device_class: temperature
    state_class: measurement
    accuracy_decimals: 2
    filters:
      - lambda: |-
          uint16_t raw = (uint16_t)x;
          if (raw == 0xFFFF) return {};
          return raw * 0.01f;

  # Cooling Flow Temp Setpoint (Register 407 - HM033) - 0.01°C
  - platform: modbus_controller
    modbus_controller_id: gtw08_controller
    name: "Cooling Flow Setpoint"
    id: cooling_flow_setpoint
    icon: mdi:snowflake-thermometer
    address: 407
    register_type: holding
    value_type: U_WORD
    unit_of_measurement: "°C"
    device_class: temperature
    state_class: measurement
    accuracy_decimals: 2
    filters:
      - lambda: |-
          uint16_t raw = (uint16_t)x;
          if (raw == 0xFFFF) return {};
          return raw * 0.01f;

  # DHW Flow Temp Setpoint (Register 408 - DM004) - 0.01°C
  - platform: modbus_controller
    modbus_controller_id: gtw08_controller
    name: "DHW Flow Setpoint"
    id: dhw_flow_setpoint
    icon: mdi:faucet-variant
    address: 408
    register_type: holding
    value_type: U_WORD
    unit_of_measurement: "°C"
    device_class: temperature
    state_class: measurement
    accuracy_decimals: 2
    filters:
      - lambda: |-
          uint16_t raw = (uint16_t)x;
          if (raw == 0xFFFF) return {};
          return raw * 0.01f;

  # Flow Rate (Register 410 - AM056) - 0.01 l/min
  - platform: modbus_controller
    modbus_controller_id: gtw08_controller
    name: "Flow Rate"
    id: flow_rate
    icon: mdi:water
    address: 410
    register_type: holding
    value_type: U_WORD
    unit_of_measurement: "l/min"
    state_class: measurement
    accuracy_decimals: 2
    filters:
      - lambda: |-
          uint16_t raw = (uint16_t)x;
          if (raw == 0xFFFF) return {};
          return raw * 0.01f;

  # COP Threshold (Register 463 - HM032) - 0.001 resolution
  - platform: modbus_controller
    modbus_controller_id: gtw08_controller
    name: "COP - Threshold"
    id: cop_threshold
    icon: mdi:chart-line-variant
    address: 463
    register_type: holding
    value_type: U_WORD
    unit_of_measurement: ""
    state_class: measurement
    accuracy_decimals: 3
    filters:
      - lambda: |-
          uint16_t raw = (uint16_t)x;
          if (raw == 0xFFFF || raw == 0) return {};
          return raw * 0.001f;

  # Heat Pump Defrost (Register 481 - HM009) - ENUM8
  - platform: modbus_controller
    modbus_controller_id: gtw08_controller
    name: "HP Defrost Code"
    id: hp_defrost_code
    address: 481
    register_type: holding
    value_type: U_WORD
    internal: true
    filters:
      - lambda: return (uint16_t)x & 0x00FF;

  # Low Noise Mode State (Register 480 - AM002) - ENUM8
  - platform: modbus_controller
    modbus_controller_id: gtw08_controller
    name: "Low Noise Mode Code"
    id: low_noise_mode_code
    address: 480
    register_type: holding
    value_type: U_WORD
    internal: true
    entity_category: diagnostic
    filters:
      - lambda: return (uint16_t)x & 0x00FF;

  # System Flow Temp Setpoint incl. backups (Register 458 - HM003) - 0.01°C
  - platform: modbus_controller
    modbus_controller_id: gtw08_controller
    name: "System Flow Setpoint"
    id: system_flow_setpoint
    icon: mdi:thermometer-chevron-up
    address: 458
    register_type: holding
    value_type: U_WORD
    unit_of_measurement: "°C"
    device_class: temperature
    state_class: measurement
    accuracy_decimals: 2
    filters:
      - lambda: |-
          uint16_t raw = (uint16_t)x;
          if (raw == 0xFFFF) return {};
          return raw * 0.01f;

  # ODU Current Draw (Register 456 - HM062) - 0.1A
  - platform: modbus_controller
    modbus_controller_id: gtw08_controller
    name: "ODU Current"
    id: odu_current
    icon: mdi:flash
    address: 456
    register_type: holding
    value_type: U_WORD
    unit_of_measurement: "A"
    state_class: measurement
    accuracy_decimals: 1
    filters:
      - lambda: |-
          uint16_t raw = (uint16_t)x;
          if (raw == 0xFFFF) return {};
          return raw * 0.1f;

  # Condenser Pump Speed (Register 453 - HM069) - 0.001 resolution
  - platform: modbus_controller
    modbus_controller_id: gtw08_controller
    name: "Condenser Pump Speed"
    id: condenser_pump_speed
    icon: mdi:pump
    address: 453
    register_type: holding
    value_type: U_WORD
    unit_of_measurement: "%"
    state_class: measurement
    accuracy_decimals: 1
    filters:
      - lambda: |-
          uint16_t raw = (uint16_t)x;
          if (raw == 0xFFFF) return {};
          return raw * 0.1f;

  # Zone 1 Flow/Return Temperature (Register 1100 - CM040) - 0.01°C
  # reuse_previous_range: false - these zone monitoring regs (1100+) are in a
  # different section from the zone config regs (640+), GTW-08 rejects bulk
  # reads spanning both
  - platform: modbus_controller
    modbus_controller_id: gtw08_controller
    name: "Zone 1 Flow Temperature"
    id: zone1_flow_temp
    icon: mdi:thermometer-chevron-up
    address: 1100
    register_type: holding
    value_type: S_WORD
    reuse_previous_range: false
    unit_of_measurement: "°C"
    device_class: temperature
    state_class: measurement
    accuracy_decimals: 2
    filters:
      - lambda: |-
          int16_t raw = (int16_t)x;
          if (raw == -32768 || raw == 0x7FFF) return {};  // 0x8000 = unavailable
          return raw * 0.01f;

  # Zone 1 Current Flow Temp Setpoint (Register 1101 - CM070) - 0.01°C
  - platform: modbus_controller
    modbus_controller_id: gtw08_controller
    name: "Zone 1 Current Setpoint"
    id: zone1_current_setpoint
    icon: mdi:thermometer-check
    address: 1101
    register_type: holding
    value_type: U_WORD
    unit_of_measurement: "°C"
    device_class: temperature
    state_class: measurement
    accuracy_decimals: 2
    filters:
      - lambda: |-
          uint16_t raw = (uint16_t)x;
          if (raw == 0xFFFF) return {};
          return raw * 0.01f;

